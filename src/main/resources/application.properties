# Application Name
spring.application.name=FamilyHub

# Server Configuration
server.port=8085

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8070/eureka/
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.instance.preferIpAddress=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/familyHub

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Configuration
jwt.
jwt.expiration=86400000

# WebSocket Configuration
spring.websocket.max-text-message-size=8192
spring.websocket.max-binary-message-size=8192

# Allow Bean Overriding
spring.main.allow-bean-definition-overriding=true

# Exclude problematic auto-configurations
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.reactive.WebFluxAutoConfiguration,org.springframework.boot.autoconfigure.web.reactive.error.ErrorWebFluxAutoConfiguration,org.springframework.boot.autoconfigure.web.reactive.function.client.WebClientAutoConfiguration

# Property Placeholder Configuration
spring.config.name=application
spring.config.location=classpath:/

# Logging Configuration
# Root logging level
logging.level.root=INFO

# Application specific logging
logging.level.com.example.FamilyHub=DEBUG
logging.level.com.example.FamilyHub.controller=DEBUG
logging.level.com.example.FamilyHub.service=DEBUG
logging.level.com.example.FamilyHub.repository=DEBUG

# Log file configuration
logging.file.name=logs/familyhub.log
logging.file.max-size=10MB
logging.file.max-history=10

# Log pattern configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# MongoDB logging (if needed)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# WebSocket logging
logging.level.org.springframework.web.reactive.socket=DEBUG

# Redis logging
logging.level.org.springframework.data.redis=DEBUG

# Security logging
logging.level.org.springframework.security=INFO

